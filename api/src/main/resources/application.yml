spring:
  application:
    name: api

  # H2 file-based datasource
  datasource:
    url: "jdbc:h2:file:D:/Workspace/data/harness-api/todo;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 console
  h2:
    console:
      enabled: true
      path: /h2-console
