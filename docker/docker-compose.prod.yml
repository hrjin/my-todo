version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: my-todo-api-prod
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${PROFILE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/todo-db
      - SPRING_DATASOURCE_DRIVERCLASSNAME=org.h2.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_H2_CONSOLE_ENABLED=false
    volumes:
      - app-data:/app/data
    networks:
      - my-todo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/todos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    driver: local

networks:
  my-todo-net:
    driver: bridge
